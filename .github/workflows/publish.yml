name: publish

# Publishes to npm, then registers with the Official MCP Registry using GitHub Actions
# OIDC — which is why no browser and no interactive login is ever needed. The ONLY secret
# this needs is NPM_TOKEN; the registry side authenticates as this repo's own identity.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # required for both npm provenance and registry OIDC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Install the MCP publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/download/v1.0.0/mcp-publisher_1.0.0_linux_amd64.tar.gz" \
            | tar xz mcp-publisher && chmod +x mcp-publisher
      - name: Register with the Official MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

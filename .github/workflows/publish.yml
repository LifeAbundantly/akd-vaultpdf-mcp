name: publish to the MCP registry

# NO NPM, NO SECRETS. The bundle is an .mcpb on a GitHub release (an allowlisted artifact
# host) and authentication is GitHub Actions OIDC — the workflow proves it is this repo by
# being this repo.
#
# 2026-07-30: the first run failed `401 token exchange failed`. Cause was a PINNED
# mcp-publisher v1.0.0 against a registry now on v1.8.0 — eight versions of API drift.
# Always resolve the latest release rather than pinning a version into a workflow that
# will outlive it.
on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install the newest MCP publisher
        run: |
          TAG=$(curl -s https://api.github.com/repos/modelcontextprotocol/registry/releases/latest | grep -oP '"tag_name":\s*"\K[^"]+')
          echo "publisher $TAG"
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/download/${TAG}/mcp-publisher_${TAG#v}_linux_amd64.tar.gz" \
            | tar xz mcp-publisher && chmod +x mcp-publisher
          ./mcp-publisher --version || true
      - name: Authenticate as this repository
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish

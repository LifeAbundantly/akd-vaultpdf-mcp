name: publish to the MCP registry

# NO NPM. The bundle is an .mcpb attached to a GitHub release, which the official registry
# accepts directly (GitHub releases are an allowlisted artifact host). Authentication is
# GitHub Actions OIDC, so there is no browser login and NO SECRET OF ANY KIND to supply —
# the workflow proves it is this repo by being this repo.
on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install the MCP publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/download/v1.0.0/mcp-publisher_1.0.0_linux_amd64.tar.gz" \
            | tar xz mcp-publisher && chmod +x mcp-publisher
      - name: Authenticate as this repository
        run: ./mcp-publisher login github-oidc
      - name: Publish
        run: ./mcp-publisher publish
